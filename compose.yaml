services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logicscope}
      POSTGRES_USER: ${POSTGRES_USER:-logicscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logicscope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - logicscope-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    command: ["--config=/etc/otelcol-contrib/otel-collector.yaml"]
    volumes:
      - ./platform/otel/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "13133:13133"

  logicscope-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_PORT: 4377
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-logicscope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-logicscope}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-logicscope}
    ports:
      - "${BACKEND_PORT:-4377}:4377"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4377/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  logicscope-postgres:
